version: "3.7"

x-environment: &immich-environment
  NODE_ENV: production
  DB_HOSTNAME: musk-immich-v3_postgres_1
  DB_USERNAME: immich
  DB_PASSWORD: ${APP_SEED}
  DB_DATABASE_NAME: immich
  REDIS_HOSTNAME: musk-immich-v3_redis_1
  LOG_LEVEL: log
  JWT_SECRET: ${APP_SEED}
  DISABLE_REVERSE_GEOCODING: "false"
  REVERSE_GEOCODING_PRECISION: "3"
  PUBLIC_LOGIN_PAGE_MESSAGE: ""
  IMMICH_MACHINE_LEARNING_URL: http://musk-immich-v3_machine-learning_1:3003

services:
  app_proxy:
    environment:
      APP_HOST: musk-immich-v3_server_1
      APP_PORT: 2283
      PROXY_AUTH_ADD: "false"
    container_name: musk-immich-v3_app_proxy_1
    devices:
      - /dev/dri
    group_add:
      - "44"
      - "991"

  server:
    image: ghcr.io/immich-app/immich-server:v3
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT}/upload
        target: /data
        read_only: false
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
      DB_HOSTNAME: musk-immich-v3_postgres_1
      DB_USERNAME: immich
      DB_PASSWORD: ${APP_SEED}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: musk-immich-v3_redis_1
      LOG_LEVEL: log
      JWT_SECRET: ${APP_SEED}
      DISABLE_REVERSE_GEOCODING: "false"
      REVERSE_GEOCODING_PRECISION: "3"
      PUBLIC_LOGIN_PAGE_MESSAGE: ""
      IMMICH_MACHINE_LEARNING_URL: http://musk-immich-v3_machine-learning_1:3003
    depends_on:
      - redis
      - postgres
    restart: on-failure
    container_name: musk-immich-v3_server_1
    devices:
      - /dev/dri
    group_add:
      - "44"
      - "991"

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3-openvino
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT}/model-cache
        target: /cache
        read_only: false
        bind:
          create_host_path: false
    environment:
      NODE_ENV: production
    restart: on-failure
    container_name: musk-immich-v3_machine-learning_1
    devices:
      - /dev/dri
    group_add:
      - "44"
      - "991"

  redis:
    image: valkey/valkey:8-bookworm
    user: "1000:1000"
    restart: on-failure
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT}/redis
        target: /data
        read_only: false
        bind:
          create_host_path: false
    container_name: musk-immich-v3_redis_1

  postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - type: bind
        source: ${APP_DATA_ROOT}/postgres
        target: /var/lib/postgresql/data
        read_only: false
        bind:
          create_host_path: false
    shm_size: 128mb
    restart: on-failure
    container_name: musk-immich-v3_postgres_1

x-umbrel-gpu-patches:
  app_proxy:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
  server:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
  machine-learning:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
  redis:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
  postgres:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
