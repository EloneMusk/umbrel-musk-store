version: "3.7"

x-environment: &immich-environment
  NODE_ENV: production
  DB_HOSTNAME: musk-immich-v3_postgres_1
  DB_USERNAME: immich
  DB_PASSWORD: ${APP_SEED}
  DB_DATABASE_NAME: immich
  REDIS_HOSTNAME: musk-immich-v3_redis_1
  LOG_LEVEL: log
  JWT_SECRET: ${APP_SEED}
  DISABLE_REVERSE_GEOCODING: "false"
  REVERSE_GEOCODING_PRECISION: "3"
  IMMICH_MACHINE_LEARNING_URL: http://musk-immich-v3_machine-learning_1:3003

services:
  app_proxy:
    environment:
      APP_HOST: musk-immich-v3_server_1
      APP_PORT: "2283"
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/immich-app/immich-server:v3
    volumes:
      - ${APP_DATA_ROOT}/upload:/data
      - /etc/localtime:/etc/localtime:ro
    environment: *immich-environment
    depends_on:
      - redis
      - postgres
      - machine-learning
    restart: on-failure
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "991"

  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3-openvino
    volumes:
      - ${APP_DATA_ROOT}/model-cache:/cache
    restart: on-failure
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "991"

  redis:
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    restart: on-failure
    volumes:
      - ${APP_DATA_ROOT}/redis:/data

  postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${APP_DATA_ROOT}/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: on-failure

x-umbrel-gpu-patches:
  app_proxy:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
  server:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
  machine-learning:
    devices:
      - /dev/dri
    deviceGroupIds:
      - 44
      - 991
